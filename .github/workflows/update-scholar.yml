name: Update Google Scholar data

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-scholar:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the portfolio
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh publications and metrics
        run: node scripts/update-scholar-data.mjs
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SCHOLAR_AUTHOR_ID: NxJb3rEAAAAJ

      - name: Commit updated JSON when it changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/scholar.json
          if git diff --cached --quiet; then
            echo "Scholar data is unchanged."
            exit 0
          fi
          git commit -m "chore: update Google Scholar data"
          git push